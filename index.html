<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="theme-color" content="#0F6E56">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Einkaufszettel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --green: #1D9E75;
    --green-dark: #0F6E56;
    --green-light: #E1F5EE;
    --red: #E24B4A;
    --red-light: #FCEBEB;
    --text: #1a1a1a;
    --text-muted: #666;
    --text-faint: #aaa;
    --bg: #f5f7f5;
    --card: #fff;
    --border: rgba(0,0,0,0.08);
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
    --radius: 16px;
    --radius-sm: 10px;
    --font: 'Nunito', sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1510;
      --card: #1a2420;
      --border: rgba(255,255,255,0.08);
      --text: #f0f0f0;
      --text-muted: #aaa;
      --text-faint: #555;
      --green-light: #0a2e22;
      --shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
  }

  html, body { height: 100%; overflow: hidden; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
  }

  .header {
    background: var(--green-dark);
    padding: 52px 20px 18px;
    color: #fff;
    flex-shrink: 0;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .header-top h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-top h1 span.emoji { font-size: 28px; }

  .badge {
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
  }

  .add-row { display: flex; gap: 10px; }

  .add-row input {
    flex: 1;
    height: 46px;
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 16px;
    font-family: var(--font);
    font-size: 16px;
    font-weight: 500;
    background: rgba(255,255,255,0.18);
    color: #fff;
    outline: none;
    caret-color: #fff;
  }

  .add-row input::placeholder { color: rgba(255,255,255,0.55); }
  .add-row input:focus { background: rgba(255,255,255,0.25); }

  .add-btn {
    width: 46px; height: 46px;
    border-radius: var(--radius-sm);
    border: none;
    background: rgba(255,255,255,0.22);
    color: #fff;
    font-size: 28px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .add-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.35); }

  .progress-bar-wrap {
    background: rgba(255,255,255,0.15);
    height: 4px; border-radius: 2px;
    margin-top: 14px; overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: rgba(255,255,255,0.8);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .list-wrap {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px 16px 100px;
  }

  .section-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-faint);
    margin: 20px 0 8px 4px;
  }

  .section-label:first-child { margin-top: 0; }

  .item {
    display: flex; align-items: center; gap: 14px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 15px 14px;
    margin-bottom: 9px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
    position: relative; overflow: hidden;
    touch-action: manipulation;
  }

  .item:active { transform: scale(0.97); }

  .item.done {
    opacity: 0.45;
    background: var(--green-light);
    box-shadow: none;
  }

  .item.fly-out {
    animation: flyOut 0.38s cubic-bezier(0.4,0,0.6,1) forwards;
  }

  @keyframes flyOut {
    0%   { transform: translateX(0); opacity: 1; max-height: 70px; margin-bottom: 9px; }
    60%  { transform: translateX(110%); opacity: 0; }
    100% { transform: translateX(110%); opacity: 0; max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
  }

  .item.slide-in {
    animation: slideIn 0.28s cubic-bezier(0.22,1,0.36,1);
  }

  @keyframes slideIn {
    from { transform: translateY(-14px) scale(0.97); opacity: 0; }
    to   { transform: translateY(0) scale(1); opacity: 1; }
  }

  .circle {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .item.done .circle { background: var(--green); border-color: var(--green); }

  .circle svg { width: 14px; height: 14px; opacity: 0; transition: opacity 0.15s; }
  .item.done .circle svg { opacity: 1; }

  .item-text {
    flex: 1;
    font-size: 17px; font-weight: 600;
    color: var(--text);
    transition: all 0.2s; line-height: 1.3;
  }

  .item.done .item-text {
    text-decoration: line-through;
    color: var(--text-faint); font-weight: 500;
  }

  .del {
    width: 34px; height: 34px;
    border-radius: 50%; border: none;
    background: transparent; color: var(--text-faint);
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background 0.15s, color 0.15s;
  }

  .del:active { background: var(--red-light); color: var(--red); }

  .empty {
    text-align: center;
    padding: 60px 20px 40px;
    color: var(--text-faint);
  }

  .empty .icon { font-size: 56px; display: block; margin-bottom: 14px; }
  .empty p { font-size: 16px; font-weight: 500; line-height: 1.5; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px 16px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--card);
    border-top: 1px solid var(--border);
    display: flex; gap: 10px;
  }

  .clear-btn {
    flex: 1; height: 50px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: transparent; color: var(--text-muted);
    font-family: var(--font); font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }

  .clear-btn:active { background: var(--red-light); color: var(--red); border-color: var(--red); }
  .clear-btn:disabled { opacity: 0.35; pointer-events: none; }

  .all-btn {
    flex: 1; height: 50px;
    border-radius: var(--radius-sm); border: none;
    background: var(--green); color: #fff;
    font-family: var(--font); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
  }

  .all-btn:active { background: var(--green-dark); transform: scale(0.97); }
  .all-btn:disabled { opacity: 0.35; pointer-events: none; }

  .offline-banner {
    display: none;
    background: #BA7517;
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    padding: 6px;
  }

  body.offline .offline-banner { display: block; }
</style>
</head>
<body>

<div class="offline-banner">📵 Offline – Änderungen werden lokal gespeichert</div>

<div class="header">
  <div class="header-top">
    <h1><span class="emoji">🛒</span> Einkaufszettel</h1>
    <span class="badge" id="badge">0 übrig</span>
  </div>
  <div class="add-row">
    <input type="text" id="newItem" placeholder="Artikel hinzufügen…" maxlength="60" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="add-btn" id="addBtn" aria-label="Hinzufügen">+</button>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
</div>

<div class="list-wrap" id="listWrap"></div>

<div class="bottom-bar">
  <button class="clear-btn" id="clearDoneBtn" disabled>🗑 Erledigt löschen</button>
  <button class="all-btn" id="clearAllBtn" disabled>Alles löschen</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

window.addEventListener('online',  () => document.body.classList.remove('offline'));
window.addEventListener('offline', () => document.body.classList.add('offline'));
if (!navigator.onLine) document.body.classList.add('offline');

const STORAGE_KEY = 'einkauf_v1';
let items = loadItems();
let nextId = items.reduce((m, i) => Math.max(m, i.id), 0) + 1;

function loadItems() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    return s ? JSON.parse(s) : [
      { id: 1, text: 'Milch', done: false },
      { id: 2, text: 'Brot', done: false },
      { id: 3, text: 'Äpfel', done: false },
    ];
  } catch(e) { return []; }
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
}

function render() {
  const wrap = document.getElementById('listWrap');
  const active = items.filter(i => !i.done);
  const done   = items.filter(i => i.done);
  const total  = items.length;

  document.getElementById('badge').textContent =
    active.length === 0 && total > 0 ? 'Alles im Wagen! 🎉' : active.length + ' übrig';

  const pct = total === 0 ? 0 : Math.round((done.length / total) * 100);
  document.getElementById('progressBar').style.width = pct + '%';

  document.getElementById('clearDoneBtn').disabled = done.length === 0;
  document.getElementById('clearAllBtn').disabled  = total === 0;

  wrap.innerHTML = '';

  if (total === 0) {
    wrap.innerHTML = `<div class="empty"><span class="icon">🛍️</span><p>Deine Liste ist leer.<br>Füge deinen ersten Artikel hinzu!</p></div>`;
    return;
  }

  if (active.length > 0) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Noch zu holen';
    wrap.appendChild(lbl);
    active.forEach(item => wrap.appendChild(makeEl(item)));
  }

  if (done.length > 0) {
    const lbl = document.createElement('div');
    lbl.className = 'section-label';
    lbl.textContent = 'Im Wagen ✓';
    wrap.appendChild(lbl);
    done.forEach(item => wrap.appendChild(makeEl(item)));
  }
}

function makeEl(item) {
  const el = document.createElement('div');
  el.className = 'item' + (item.done ? ' done' : '');
  el.dataset.id = item.id;
  el.innerHTML = `
    <div class="circle">
      <svg viewBox="0 0 14 14" fill="none">
        <polyline points="2,7 6,11 12,3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="item-text">${esc(item.text)}</span>
    <button class="del" aria-label="Löschen" data-del="${item.id}">×</button>
  `;

  el.querySelector('[data-del]').addEventListener('click', e => {
    e.stopPropagation();
    el.classList.add('fly-out');
    setTimeout(() => { items = items.filter(i => i.id !== item.id); save(); render(); }, 380);
  });

  el.addEventListener('click', () => {
    item.done = !item.done;
    save();
    if (item.done) {
      el.classList.add('done');
      setTimeout(() => { el.classList.add('fly-out'); setTimeout(() => render(), 400); }, 80);
    } else {
      render();
    }
  });

  return el;
}

function addItem() {
  const input = document.getElementById('newItem');
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  items.unshift({ id: nextId++, text, done: false });
  save();
  input.value = '';
  render();
  const first = document.querySelector('.item');
  if (first) first.classList.add('slide-in');
  input.focus();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('newItem').addEventListener('keydown', e => { if (e.key === 'Enter') addItem(); });

document.getElementById('clearDoneBtn').addEventListener('click', () => {
  document.querySelectorAll('.item.done').forEach(el => el.classList.add('fly-out'));
  setTimeout(() => { items = items.filter(i => !i.done); save(); render(); }, 380);
});

document.getElementById('clearAllBtn').addEventListener('click', () => {
  if (!confirm('Wirklich alle Artikel löschen?')) return;
  items = []; save(); render();
});

render();
</script>
</body>
</html>
